# Render Blueprint for the Who Am I? front end (a static single-page app).
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    runtime: static
    name: cetacea-i
    branch: main
    # Redeploy a push to main only after the GitHub Actions CI check (lint, tests, build) passes.
    autoDeployTrigger: checksPass

    # `npm ci` installs exactly what package-lock.json says. Vite 8 needs Node ^20.19 or >=22.12.
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    envVars:
      - key: NODE_VERSION
        value: "22"

    routes:
      # The app routes in the browser (/assessment, /dashboard, ?step=…). Without this,
      # opening or refreshing any of those links makes Render answer 404.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Built files are named by their content, so they can be cached for good.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html must always be re-checked, or visitors keep an old build after a deploy.
      - path: /index.html
        name: Cache-Control
        value: no-cache
